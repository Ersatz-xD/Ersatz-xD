name: Generate Profile Stat SVGs

on:
  schedule:
    # Runs daily at 06:17 UTC
    - cron: "17 6 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate SVG graphics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}
          OUT_DIR: .
        run: python3 stats.py

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update profile stat SVGs [skip ci]"
          file_pattern: "*.svg"